# Vertex AI CustomJob: NOISE-FLOOR run (--sweep seeds).
#
# Trains the SAME champion recipe three times, differing only by random seed.
#
# Why this deserves a job of its own: training was never seeded (config.SEED
# only ever touched data splitting), and the identical recipe on the IDENTICAL
# splits scored AUROC 0.810 in full-gpu-01 and 0.837 in full-gpu-02 — with
# specificity@floor 0.556 vs 0.674. That spread is WIDER than the gaps between
# the five imbalance configs, which means no single-run comparison in this
# project is currently trustworthy, including the imbalance result itself.
#
# OUTPUT TO READ: the spread (std dev) of op_specificity / op_precision / auroc
# across the three rows. That is the smallest difference any future sweep is
# allowed to call real.
#
# COST: ~4h/config => ~12h + the ~178 GB download.
#
# SUBMIT (from github/secondlook, after staging the sdist):
#   gcloud ai custom-jobs create \
#     --project=b2-second-look --region=us-east1 \
#     --display-name="second-look-seeds-$(date +%Y%m%d-%H%M%S)" \
#     --service-account=vertex-training-b2-second-look@b2-second-look.iam.gserviceaccount.com \
#     --config=vertex/sweep-seeds.yaml

workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-16
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 500
    pythonPackageSpec:
      executorImageUri: us-docker.pkg.dev/vertex-ai/training/tf-gpu.2-17.py310:latest
      packageUris:
        - gs://b2-foundation/second-look/vertex-staging/packages/second_look_training-0.1.0.tar.gz
      pythonModule: scripts.sweep_vertex
      args:
        - --sweep
        - seeds
        - --datasets
        - cbis
        - rsna
        - vindr
        - --max-epochs
        - "20"
        - --batch-size
        - "32"
        - --max-workers
        - "16"
        - --checkpoint-dir
        - gs://b2-foundation/second-look/checkpoints/full-gpu-03-seeds
